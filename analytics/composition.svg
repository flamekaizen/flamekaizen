  <text x="36.0" y="31.0" class="h" font-size="13" text-anchor="start" >CONTRIBUTION COMPOSITION</text>
  <text x="36.0" y="47.0" class="m" font-size="10.5" text-anchor="start" >lifetime event mix by type</text>
