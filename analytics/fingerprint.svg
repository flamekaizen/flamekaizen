<title>Temporal Fingerprint — when work happens · last 12 months</title>

<style>
  .t  { font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#C9D1D9; }
  .m  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#8B949E; }
  .h  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#F0F6FC; font-weight:700; letter-spacing:2px; }
  .v  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#F0F6FC; font-weight:700; }
  .lbl{ font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#8B949E; font-size:10px; letter-spacing:1.2px; }
  .fade { animation: fade .9s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  .growx{ transform-box: fill-box; transform-origin: 0% 50%;  animation: growx 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .draw { stroke-dasharray: 1; animation: draw 2.2s ease-out both; }
  .pulse{ animation: pulse 1.6s ease-in-out infinite; }
  .scan { animation: scan 6s linear infinite; }
  @keyframes fade  { from { opacity:0; } }
  @keyframes grow  { from { transform: scaleY(0); } }
  @keyframes growx { from { transform: scaleX(0); } }
  @keyframes draw  { from { stroke-dashoffset: 1; } }
  @keyframes pulse { 50% { opacity:.25; } }
  @keyframes scan  { from { transform: translateY(-40px); } to { transform: translateY(var(--h)); } }
</style>
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#21262D" stroke-width=".5" opacity=".55"/></pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859" stop-opacity="0"/><stop offset="1" stop-color="#F73859" stop-opacity=".07"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859" stop-opacity=".45"/><stop offset="1" stop-color="#F73859" stop-opacity="0"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859"/><stop offset="1" stop-color="#7D1D31"/></linearGradient>
