<svg xmlns="http://www.w3.org/2000/svg" width="445" height="300" viewBox="0 0 445 300" role="img" aria-label="Weekly Rhythm">
<title>Weekly Rhythm — lifetime contributions by weekday</title>

<style>
  .t  { font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill:#C9D1D9; }
  .m  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#8B949E; }
  .h  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#F0F6FC; font-weight:700; letter-spacing:2px; }
  .v  { font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#F0F6FC; font-weight:700; }
  .lbl{ font-family:'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill:#8B949E; font-size:10px; letter-spacing:1.2px; }
  .fade { animation: fade .9s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  .growx{ transform-box: fill-box; transform-origin: 0% 50%;  animation: growx 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .draw { stroke-dasharray: 1; animation: draw 2.2s ease-out both; }
  .pulse{ animation: pulse 1.6s ease-in-out infinite; }
  .scan { animation: scan 6s linear infinite; }
  @keyframes fade  { from { opacity:0; } }
  @keyframes grow  { from { transform: scaleY(0); } }
  @keyframes growx { from { transform: scaleX(0); } }
  @keyframes draw  { from { stroke-dashoffset: 1; } }
  @keyframes pulse { 50% { opacity:.25; } }
  @keyframes scan  { from { transform: translateY(-40px); } to { transform: translateY(var(--h)); } }
</style>
<defs>
  <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#21262D" stroke-width=".5" opacity=".55"/></pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859" stop-opacity="0"/><stop offset="1" stop-color="#F73859" stop-opacity=".07"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859" stop-opacity=".45"/><stop offset="1" stop-color="#F73859" stop-opacity="0"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F73859"/><stop offset="1" stop-color="#7D1D31"/></linearGradient>
  <linearGradient id="barx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7D1D31"/><stop offset="1" stop-color="#F73859"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="443" height="298" rx="8"/></clipPath>
</defs>
<rect x=".5" y=".5" width="444" height="299" rx="8" fill="#0D1117" stroke="#30363D"/>
<g clip-path="url(#frame)">
  <rect width="445" height="300" fill="url(#g)"/>
  <rect class="scan" style="--h:300px" x="0" y="0" width="445" height="40" fill="url(#scan)"/>
</g>
<path d="M1.5 14 V1.5 H14 M431 1.5 H443.5 V14 M443.5 286 V298.5 H431 M14 298.5 H1.5 V286" stroke="#F73859" stroke-width="2" fill="none"/>
<g class="fade">
  <circle class="pulse" cx="24" cy="27" r="4" fill="#F73859" filter="url(#glow)"/>
  <text x="36.0" y="31.0" class="h" font-size="13" text-anchor="start" >WEEKLY RHYTHM</text>
  <text x="36.0" y="47.0" class="m" font-size="10.5" text-anchor="start" >lifetime contributions by weekday</text>
  <text x="423.0" y="31.0" class="m" font-size="10" text-anchor="end" fill="#F73859" letter-spacing="1.5">MOD-04</text>
  <text x="423.0" y="47.0" class="m" font-size="9" text-anchor="end" >SYNC 2026-11-13 03:09 UTC</text>
  <line x1="20" y1="58" x2="425" y2="58" stroke="#30363D"/>
  <line x1="20" y1="58" x2="90" y2="58" stroke="#F73859" stroke-width="2"/>
</g>
<polyline points="150.0,159.0 168.0,167.7 172.4,187.1 160.0,202.7 140.0,202.7 127.6,187.1 132.0,167.7 150.0,159.0" fill="none" stroke="#21262D"/>
<polyline points="150.0,136.0 186.0,153.3 194.8,192.2 170.0,223.4 130.0,223.4 105.2,192.2 114.0,153.3 150.0,136.0" fill="none" stroke="#21262D"/>
<polyline points="150.0,113.0 203.9,139.0 217.3,197.4 179.9,244.2 120.1,244.2 82.7,197.4 96.1,139.0 150.0,113.0" fill="none" stroke="#21262D"/>
<polyline points="150.0,90.0 221.9,124.6 239.7,202.5 189.9,264.9 110.1,264.9 60.3,202.5 78.1,124.6 150.0,90.0" fill="none" stroke="#30363D"/>
<line x1="150" y1="182" x2="150.00" y2="90.00" stroke="#21262D"/>
<text x="150.0" y="78.0" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Mon</text>
<line x1="150" y1="182" x2="221.93" y2="124.64" stroke="#21262D"/>
<text x="234.4" y="118.7" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Tue</text>
<line x1="150" y1="182" x2="239.69" y2="202.47" stroke="#21262D"/>
<text x="255.3" y="210.0" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Wed</text>
<line x1="150" y1="182" x2="189.92" y2="264.89" stroke="#21262D"/>
<text x="196.9" y="283.3" class="m" font-size="10" text-anchor="middle" fill="#F73859" >Thu</text>
<line x1="150" y1="182" x2="110.08" y2="264.89" stroke="#21262D"/>
<text x="103.1" y="283.3" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Fri</text>
<line x1="150" y1="182" x2="60.31" y2="202.47" stroke="#21262D"/>
<text x="44.7" y="210.0" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Sat</text>
<line x1="150" y1="182" x2="78.07" y2="124.64" stroke="#21262D"/>
<text x="65.6" y="118.7" class="m" font-size="10" text-anchor="middle" fill="#8B949E" >Sun</text>
<path class="fade" style="animation-delay:.3s" d="M150.00,114.53 L162.47,172.06 L202.62,194.01 L189.92,264.89 L137.76,207.42 L98.58,193.74 L97.25,139.94 Z" fill="#F73859" fill-opacity=".22" stroke="#F73859" stroke-width="2" filter="url(#glow)"/>
<circle class="fade" style="animation-delay:.6s" cx="150.00" cy="114.53" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="162.47" cy="172.06" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="202.62" cy="194.01" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="189.92" cy="264.89" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="137.76" cy="207.42" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="98.58" cy="193.74" r="3" fill="#F73859"/>
<circle class="fade" style="animation-delay:.6s" cx="97.25" cy="139.94" r="3" fill="#F73859"/>
<g class="fade" style="animation-delay:0.2s"><text x="290.0" y="92.0" class="lbl" font-size="9.5" text-anchor="start" >PEAK DAY</text><text x="290.0" y="118.0" class="v" font-size="22" text-anchor="start" fill="#F0F6FC" >Thu</text><text x="290.0" y="134.0" class="m" font-size="9.5" text-anchor="start" >24% of volume</text></g>
<g class="fade" style="animation-delay:0.3s"><text x="290.0" y="156.0" class="lbl" font-size="9.5" text-anchor="start" >WEEKEND SHARE</text><text x="290.0" y="182.0" class="v" font-size="22" text-anchor="start" fill="#F0F6FC" >32%</text><text x="290.0" y="198.0" class="m" font-size="9.5" text-anchor="start" >Sat + Sun</text></g>
<g class="fade" style="animation-delay:0.4s"><text x="290.0" y="220.0" class="lbl" font-size="9.5" text-anchor="start" >REGULARITY</text><text x="290.0" y="246.0" class="v" font-size="22" text-anchor="start" fill="#F0F6FC" >0.95</text><text x="290.0" y="262.0" class="m" font-size="9.5" text-anchor="start" >norm. Shannon H</text></g>
</svg>
