name: Generate Custom Animated Art

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.svg'
      - '**/*.gif'
      - '**/*.png'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install matplotlib numpy pillow imageio
        
      - name: Generate Animated Art
        run: python scripts/generate_art.py
        
      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add custom_art.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "Render updated 3D Animated profile GIF" && git push)
