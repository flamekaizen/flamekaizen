name: Generate Detailed Profile Metrics
on:
  schedule:
    - cron: "0 0-23/12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.svg'
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: UTC
          
          # Base plugins 
          base: header, activity, community, repositories, metadata
          
          # Advanced Languages Plugin
          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_details: percentage
          
          # Deep Coding Habits (peak hours, daily commits)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Half-year isometric commit calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Lines of Code History
          plugin_lines: yes
